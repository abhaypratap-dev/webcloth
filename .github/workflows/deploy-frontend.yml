# Deploys the Cut & Cult storefront (and its admin at /admin) to Azure Static
# Web Apps. This repo holds only this brand's UI; the API lives in
# platform-api and serves every brand.
name: Deploy Cut & Cult

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      # Baked in at build time. VITE_TENANT_SLUG is what tells the shared API
      # which brand this site is.
      - name: Build
        run: npm run build:azure
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_TENANT_SLUG: ${{ vars.VITE_TENANT_SLUG }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ".output/public"
          api_location: ".output/server"
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
