# Checks the Cut & Cult storefront. The API has its own repo and its own
# tests (platform-api).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      # Lint is not a gate yet: this codebase has ~500 pre-existing Prettier
      # formatting differences. Run `npx prettier --write .` once, then make
      # this a blocking step.
      - name: Lint (advisory)
        run: npm run lint || true
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.invalid/api
          VITE_TENANT_SLUG: cutcult
