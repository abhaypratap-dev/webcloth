name: CI

# Runs on every push and PR — build/typecheck/system-check validation only.
# Actual deployment happens in deploy-backend.yml / deploy-frontend.yml,
# which trigger on push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cutcult
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "True"
      POSTGRES_DB: cutcult
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for unapplied model changes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Migrate
        working-directory: backend
        run: python manage.py migrate --noinput

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm run lint` is intentionally not a CI gate yet: the codebase has
      # pre-existing Prettier formatting debt (not introduced here) that
      # would need a dedicated repo-wide reformat pass to clear. Run
      # `npm run format` locally when tackling that separately.

      - name: Build (sanity check)
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.invalid/api
