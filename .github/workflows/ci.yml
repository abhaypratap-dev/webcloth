# Checks the Cut & Cult storefront. The API has its own repo and its own
# tests (platform-api).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://placeholder.invalid/api
          VITE_TENANT_SLUG: cutcult
