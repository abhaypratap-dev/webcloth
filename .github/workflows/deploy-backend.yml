name: Deploy Backend (Azure App Service)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    services:
      # Throwaway database for the test run below. The test runner creates and
      # drops a `test_*` database, which must never happen on the production
      # server the `check` step's credentials point at.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cutcult
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Django's `check` catches missing/broken settings before they ever
      # reach Azure.
      - name: Install dependencies and run checks
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_SSLMODE: require

      # A red test run must stop the deploy, so this sits ahead of packaging.
      # CI runs the same suite, but CI and deploy race each other on a push to
      # main — a CI failure alone would not hold this workflow back.
      - name: Tests
        working-directory: backend
        run: python manage.py test --noinput
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-production
          DJANGO_DEBUG: "False"
          DJANGO_SECURE_SSL_REDIRECT: "False"
          DJANGO_ALLOWED_HOSTS: testserver,localhost
          DJANGO_LOG_LEVEL: CRITICAL
          POSTGRES_DB: cutcult
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_SSLMODE: prefer

      - name: Package backend
        working-directory: backend
        run: zip -r ../backend.zip . -x ".venv/*" "__pycache__/*" "*.pyc" "**/__pycache__/*" "media/*" "staticfiles/*" -q

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          az webapp deploy \
            --resource-group cutcult-rg \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --src-path backend.zip \
            --type zip

      # Azure App Service restarts the container on deploy, which runs
      # startup.sh (migrate + collectstatic + gunicorn) automatically —
      # no separate migration step is needed here.
      - name: Verify health endpoint
        run: |
          sleep 30
          curl -f "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health/" || (echo "Health check failed" && exit 1)

      - name: Azure logout
        if: always()
        run: az logout
